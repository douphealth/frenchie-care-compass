name: Refresh npm security lock

on:
  push:
    branches:
      - fix/end-to-end-premium-stripe-20260929

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/end-to-end-premium-stripe-20260929
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Apply safe lockfile fixes
        run: npm audit fix --package-lock-only || true
      - name: Upgrade React Router to patched line
        run: npm install react-router-dom@7.18.4 --save --package-lock-only
      - name: Commit dependency security refresh
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No dependency changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: refresh runtime dependencies for security"
          git push
