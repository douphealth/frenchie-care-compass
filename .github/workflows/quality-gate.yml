name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check --config supabase/deno.json supabase/functions/create-payment/index.ts
          deno check --config supabase/deno.json supabase/functions/get-pricing/index.ts
          deno check --config supabase/deno.json supabase/functions/verify-payment/index.ts
          deno check --config supabase/deno.json supabase/functions/stripe-webhook/index.ts
          deno check --config supabase/deno.json supabase/functions/generate-plan/index.ts
