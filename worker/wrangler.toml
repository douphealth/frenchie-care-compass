# Existing worker. Deploy updates this script. Do not rename it: a new name creates a second worker.
name = "frenchyfab-careplan-selfhosted-proxy"
main = "careplan-proxy.js"
compatibility_date = "2026-09-01"
account_id = "5dc0401c38d9de0c6947fee40a210937"

# Dashboard routes today: the wildcard, the bare host, and the slash path.
# Keep all three. Dropping the bare host would let that request skip the worker
# and follow DNS to the gearup-flow-master Pages alias.
routes = [
  { pattern = "care-plan.frenchyfab.com", zone_name = "frenchyfab.com" },
  { pattern = "care-plan.frenchyfab.com/", zone_name = "frenchyfab.com" },
  { pattern = "care-plan.frenchyfab.com/*", zone_name = "frenchyfab.com" },
]

# Secrets (Wrangler CLI only, never commit values):
#   STRIPE_SECRET_KEY      set. Replace it with the MyFrenchyBulldog restricted key
#                          (Checkout Sessions read + checkout_session_write) before flipping CHECKOUT_VIA_LINKS.
#   STRIPE_WEBHOOK_SECRET  set. Endpoint we_1UeYW8GCqwm95OGXL7So4Hpj.
#   BREVO_API_KEY          secret. Do not put this key under [vars].

# Created in account 5dc0401c38d9de0c6947fee40a210937. Same account as this worker.
[[kv_namespaces]]
binding = "CAREPLAN_KV"
id = "c19be13a9f5c41e3b4dfad50d0e26efd"

[vars]
# Frenchie Care Plan Leads. List 8 belongs to another app.
BREVO_LIST_ID = "13"
MAIL_FROM = "info@frenchyfab.com"
# Keep "1" so a plain `wrangler deploy` stays on Payment Links.
# Flip to "0" only after STRIPE_SECRET_KEY on the worker is the MyFrenchyBulldog
# restricted key with checkout_session_write.
CHECKOUT_VIA_LINKS = "1"
# "0" skips invoice_creation on Checkout Sessions. "1" creates an invoice for the
# Customer Portal (default config bpc_1UeYeZGCqwm95OGXOTbnvceF).
INVOICE_CREATION = "1"
